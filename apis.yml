name: Lua Global Inc
description: >-
  Lua (heylua.ai), operated by Lua Global Inc, is a Y Combinator-backed "Agent
  OS" platform for building, testing, deploying, and governing enterprise AI
  agents. People and agents work in shared rooms with shared memory and
  governance on every action. Developers author agents in TypeScript with the
  lua-cli SDK (LuaAgent/LuaSkill/LuaTool, plus webhooks, scheduled jobs, and
  pre/post processors), while non-technical users build support, sales, HR, and
  research agents no-code. Agents are model-agnostic (OpenAI, Anthropic, Meta,
  DeepSeek, Gemini, Groq, xAI, Qwen) and deploy across WhatsApp, Slack, Email,
  Teams, Instagram, voice, an embeddable web chat widget (LuaPop), and a public
  HTTP chat API at api.heylua.ai. A read-only MCP server exposes agent state to
  MCP-aware clients.
